<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🏓 Pickleball Unifié</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Exo 2', Arial, sans-serif;
            background: #f0fff0;
            color: #333;
            min-height: 100vh;
            padding: 8px;
        }
        .app {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.98);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            color: #9c27b0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 8px 0;
        }
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            min-height: 36px;
            color: white;
            background: #9c27b0;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn.secondary { background: #3498db; }
        .btn.danger { background: #f44336; }
        .btn.success { background: #4caf50; }
        .btn.warning { background: #ff9800; }
        .btn.ghost { background: #e9ecef; color: #333; border: 1px solid #ccc; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-sm { padding: 5px 10px; font-size: 0.75rem; min-height: 28px; }
        .tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 10px;
            background: #f8f9fa;
            padding: 4px;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            color: #495057;
            min-height: 36px;
            flex: 1;
            text-align: center;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .tab-btn.active { background: #9c27b0; color: white; }
        .tab-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .tab { display: none; animation: fadeIn 0.2s ease; }
        .tab.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .card {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e6e6e6;
        }
        .card-title {
            font-weight: 700;
            color: #9c27b0;
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            border-left: 3px solid #9c27b0;
            padding-left: 8px;
        }
        .player-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin: 4px 0;
        }
        .player-number {
            width: 28px;
            height: 28px;
            background: #9c27b0;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .player-input {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 0.85rem;
            min-height: 36px;
        }
        .match {
            border: 2px solid #f0f0f0;
            padding: 10px;
            margin: 6px 0;
            border-radius: 6px;
            background: #fafafa;
        }
        .court-header {
            font-weight: bold;
            color: #9c27b0;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }
        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 3px 0;
            flex-wrap: wrap;
            gap: 4px;
        }
        .vs {
            text-align: center;
            font-weight: bold;
            color: #ff9800;
            margin: 4px 0;
            font-size: 0.9rem;
        }
        .score-input {
            width: 60px;
            padding: 5px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 3px;
            font-size: 0.9rem;
            min-height: 32px;
        }
        .score-input.win { border-color: #4caf50; background: #e8f5e8; }
        table.ranking {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.8rem;
        }
        table.ranking th {
            background: #9c27b0;
            color: white;
            padding: 8px;
            text-align: center;
        }
        table.ranking td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
        }
        .status-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.7);
            padding: 8px;
            border-radius: 6px;
            margin: 8px 0;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
        }
        .round-border {
            border: 2px solid #9c27b0;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            background: #f8f9fa;
        }
        .round-title {
            background: #9c27b0;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            margin: -10px -10px 10px -10px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .public-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0;
        }
        .public-buttons .btn {
            min-width: 120px;
            justify-content: center;
        }
        .public-buttons .btn.locked {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .public-buttons .btn.unlocked {
            background: #28a745;
        }
        .admin-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .admin-toggle label {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .admin-toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .spectator-only { display: none; }
        .spectator-mode .spectator-only { display: block; }
        .spectator-mode .admin-only { display: none; }
        .spectator-mode .print-btn { display: none; }
        #notice {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 999;
            font-size: 0.9rem;
        }
        #notice.error { background: #f44336; }
        @media (max-width: 600px) {
            .public-buttons .btn { min-width: 100px; font-size: 0.75rem; }
            .team-row { flex-direction: column; align-items: stretch; }
            .vs { margin: 2px 0; }
        }
        @media print {
            .no-print { display: none !important; }
            .tab { display: block !important; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <header>
        <h1><i class="fas fa-table-tennis-paddle-ball"></i> Tournoi Pickleball</h1>
        <div class="public-buttons">
            <button class="btn locked" id="btnLive" onclick="goToLive()"><i class="fas fa-eye"></i> Live</button>
            <button class="btn locked" id="btnScreen" onclick="goToTV()"><i class="fas fa-tv"></i> Écran</button>
            <button class="btn locked" id="btnPlayers" onclick="showPlayersTab()"><i class="fas fa-users"></i> Joueurs</button>
            <button class="btn locked" id="btnProgram" onclick="showProgram()"><i class="fas fa-calendar-alt"></i> Programme</button>
        </div>
        <div class="admin-toggle admin-only">
            <label for="publicAccessToggle">🔓 Accès public :</label>
            <input type="checkbox" id="publicAccessToggle" onchange="togglePublicAccess()">
            <span id="publicAccessLabel">Désactivé</span>
        </div>
        <div class="controls no-print admin-only">
            <button class="btn secondary" onclick="generateTournament()"><i class="fas fa-play"></i> Générer</button>
            <button class="btn warning" onclick="shufflePositions()"><i class="fas fa-shuffle"></i> Mélanger</button>
            <button class="btn success" onclick="saveData()"><i class="fas fa-save"></i> Sauvegarder</button>
            <button class="btn danger" onclick="resetAll()"><i class="fas fa-trash"></i> Réinitialiser</button>
            <button class="btn ghost" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Quitter</button>
        </div>
        <div class="status-bar no-print">
            <div class="status-item"><i class="fas fa-users"></i> <span id="activePlayersCount">0</span> joueurs</div>
            <div class="status-item"><i class="fas fa-trophy"></i> <span id="completedMatches">0</span> matchs</div>
            <div class="status-item"><i class="fas fa-clock"></i> <span id="tournamentProgress">0%</span> complété</div>
        </div>
    </header>

    <div class="tabs no-print admin-only">
        <button class="tab-btn active" onclick="showTab('playersTab')"><i class="fas fa-users"></i> Joueurs</button>
        <button class="tab-btn" onclick="showTab('matchesTab')"><i class="fas fa-trophy"></i> Matchs</button>
        <button class="tab-btn" onclick="showTab('rankingTab')"><i class="fas fa-chart-bar"></i> Classement</button>
        <button class="tab-btn" onclick="showTab('statsTab')"><i class="fas fa-chart-pie"></i> Stats</button>
    </div>

    <!-- TAB: JOUEURS -->
    <div id="playersTab" class="tab active">
        <div class="card admin-only">
            <span class="card-title"><i class="fas fa-user-friends"></i> Configuration</span>
            <div class="player-row">
                <div style="font-weight:600; min-width:100px; font-size:0.85rem;">Terrains:</div>
                <select id="courtsCount" onchange="changeCourtsCount()" style="padding:8px; border-radius:5px; border:2px solid #ddd; font-size:0.85rem;">
                    <option value="3">3 terrains (8-16 joueurs)</option>
                    <option value="4">4 terrains (12-20 joueurs)</option>
                    <option value="5">5 terrains (16-20 joueurs)</option>
                </select>
            </div>
            <div class="player-row">
                <div style="font-weight:600; min-width:100px; font-size:0.85rem;">Joueurs:</div>
                <select id="playerCount" onchange="changePlayerCount()" style="padding:8px; border-radius:5px; border:2px solid #ddd; font-size:0.85rem;"></select>
            </div>
        </div>
        <div class="card">
            <span class="card-title"><i class="fas fa-user-friends"></i> Liste des joueurs</span>
            <div id="playersInputs"></div>
            <div style="margin-top: 10px;" class="no-print admin-only">
                <button class="btn secondary" onclick="autoFillPlayers()"><i class="fas fa-magic"></i> Remplir auto</button>
                <button class="btn danger" onclick="clearPlayers()"><i class="fas fa-eraser"></i> Vider</button>
            </div>
        </div>
        <div class="card admin-only">
            <span class="card-title"><i class="fas fa-random"></i> Tirage des positions</span>
            <div id="positionsList"></div>
        </div>
        <div class="card spectator-only" id="programCard" style="display:none;">
            <span class="card-title"><i class="fas fa-calendar-alt"></i> Programme individuel</span>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <select id="playerProgramSelect" style="padding:8px; border:2px solid #ddd; border-radius:5px; flex:1; min-width:150px;">
                    <option value="">Sélectionnez un joueur</option>
                </select>
                <button class="btn secondary" onclick="showPlayerProgram()"><i class="fas fa-eye"></i> Voir</button>
            </div>
            <div id="playerProgramDisplay" style="margin-top: 10px; display: none; border: 1px solid #ddd; border-radius: 5px; padding: 10px; background: #fafafa;"></div>
        </div>
    </div>

    <!-- TAB: MATCHS -->
    <div id="matchesTab" class="tab">
        <div class="card">
            <span class="card-title"><i class="fas fa-calendar-alt"></i> Planning des Matchs</span>
            <div id="matchesDisplay"><p style="text-align:center;color:#666;padding:20px;">Cliquez sur "Générer" pour créer les matchs</p></div>
        </div>
    </div>

    <!-- TAB: CLASSEMENT -->
    <div id="rankingTab" class="tab">
        <div class="card">
            <span class="card-title"><i class="fas fa-list-ol"></i> Classement</span>
            <div style="overflow-x:auto;">
                <table class="ranking" id="rankingTable">
                    <thead><tr><th>Pos</th><th>Joueur</th><th>Pts +</th><th>Pts -</th><th>Diff</th><th>V</th><th>N</th><th>D</th></tr></thead>
                    <tbody id="rankingBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TAB: STATS -->
    <div id="statsTab" class="tab">
        <div class="card">
            <span class="card-title"><i class="fas fa-chart-line"></i> Statistiques Détaillées</span>
            <div id="statsArea"></div>
        </div>
    </div>
</div>

<!-- NOTICE -->
<div id="notice"></div>

    // ===== INIT =====
    function init() {
        const courtsSelect = document.getElementById('courtsCount');
        if (courtsSelect) courtsSelect.value = '3';
        buildPlayerCountOptions(8);
        const pcSelect = document.getElementById('playerCount');
        if (pcSelect) N = parseInt(pcSelect.value);
        courts = 3;
        positions = Array.from({ length: N }, (_, i) => i + 1);
        ST.players = {};
        for (let i = 1; i <= N; i++) ST.players[i] = 'Joueur ' + i;
        buildPlayerInputs();
        updatePositions();
        updatePlayerProgramSelect();
        updateStatusBar();
        updatePublicButtons();
        // Simuler un admin par défaut pour la démo
        isAdmin = true;
        document.body.classList.remove('spectator-mode');
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
        document.querySelectorAll('.spectator-only').forEach(el => el.style.display = 'none');
        showNotice('🏓 Application prête - Mode Admin');
        // Déverrouiller par défaut pour l'admin
        document.getElementById('publicAccessToggle').checked = true;
        publicAccess = true;
        updatePublicButtons();
    }

    // ===== BUILD PLAYER INPUTS =====
    function buildPlayerInputs() {
        const container = document.getElementById('playersInputs');
        if (!container) return;
        container.innerHTML = '';
        const maxN = 20;
        for (let i = 1; i <= maxN; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'player-row';
            wrapper.style.display = i <= N ? 'flex' : 'none';
            const name = ST.players[i] || 'Joueur ' + i;
            wrapper.innerHTML = `
                <div class="player-number">${i}</div>
                <input type="text" class="player-input" id="player${i}" placeholder="Joueur ${i}" value="${name}">
            `;
            container.appendChild(wrapper);
        }
        for (let i = 1; i <= maxN; i++) {
            const input = document.getElementById('player' + i);
            if (input) {
                input.addEventListener('input', function() {
                    ST.players[i] = this.value;
                });
            }
        }
        updateActiveCount();
    }

    function updateActiveCount() {
        const countEl = document.getElementById('activePlayersCount');
        if (countEl) countEl.textContent = N;
    }

    // ===== POSITIONS =====
    function updatePositions() {
        const container = document.getElementById('positionsList');
        if (!container) return;
        container.innerHTML = '';
        positions.forEach((p, idx) => {
            const div = document.createElement('div');
            div.className = 'player-row';
            div.innerHTML = `
                <div class="player-number">${idx + 1}</div>
                <span style="font-weight:600;">${getPlayerName(p)}</span>
            `;
            container.appendChild(div);
        });
    }

    window.shufflePositions = function() {
        for (let i = positions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [positions[i], positions[j]] = [positions[j], positions[i]];
        }
        ST.positions = positions;
        updatePositions();
        showNotice('Positions mélangées');
    };

    // ===== GENERATE TOURNAMENT =====
    window.generateTournament = function() {
        const grid = getGridForN();
        if (!grid) {
            showNotice('⚠️ Aucune grille disponible pour cette configuration.', 'error');
            return;
        }
        ST.schedule = JSON.parse(JSON.stringify(grid));
        ST.matchScores = {};
        ST.specialMatchScores = {};
        ST.playerReplacements = {};
        ST.replacementLog = [];
        matchScores = {};
        specialMatchScores = {};
        playerReplacements = {};
        replacementLog = [];
        renderMatches();
        calculateRanking();
        updateStats();
        showNotice('✅ Tournoi généré avec succès');
    };

                                        </select>
                                        <span style="margin:0 3px;">+</span>

                                        </select>`}

                        `;
                    }

                    matchDiv.innerHTML = html;
                    roundDiv.appendChild(matchDiv);
                }
            }
            container.appendChild(roundDiv);
        }

        // Charger les remplacements existants
        loadReplacements();

        // Écouter les changements de scores (admin uniquement)
        if (isAdmin) {
            document.querySelectorAll('.score-input').forEach(input => {
                input.addEventListener('input', function() {
                    const round = parseInt(this.dataset.round);
                    const court = parseInt(this.dataset.court);
                    const side = parseInt(this.dataset.side);
                    const score = this.value;

                    const grid = getGridForN();
                    const courtObj = grid[round] && grid[round][court];
                    if (courtObj && (courtObj.type === '1x1' || courtObj.type === '2x1')) {
                        if (!specialMatchScores[round]) specialMatchScores[round] = {};
                        if (!specialMatchScores[round][court]) specialMatchScores[round][court] = {};
                        specialMatchScores[round][court][side] = score;
                    } else {
                        if (!matchScores[round]) matchScores[round] = {};
                        if (!matchScores[round][court]) matchScores[round][court] = {};
                        matchScores[round][court][side] = score;
                    }
                    ST.matchScores = matchScores;
                    ST.specialMatchScores = specialMatchScores;
                    calculateRanking();
                    updateStats();
                    updateStatusBar();
                });
            });
        }
    }

    function loadReplacements() {
        Object.keys(playerReplacements).forEach(round => {
            Object.keys(playerReplacements[round]).forEach(court => {
                Object.keys(playerReplacements[round][court]).forEach(position => {
                    const replacementPlayer = playerReplacements[round][court][position];
                    const select = document.querySelector(`[data-round="${round}"][data-court="${court}"][data-position="${position}"]`);
                    if (select) {
                        select.value = replacementPlayer;
                    }
                });
            });
        });
    }

    window.updatePlayerReplacement = function(round, court, position, newPlayerId) {
        if (!isAdmin) {
            showNotice('❌ Seul l\'admin peut remplacer des joueurs.', 'error');
            return;
        }
        const grid = getGridForN();
        if (!grid[round] || !grid[round][court]) return;

        const originalMapped = grid[round][court].players.map(p => positions[p - 1]);
        const oldPlayer = originalMapped[position];

        if (!playerReplacements[round]) playerReplacements[round] = {};
        if (!playerReplacements[round][court]) playerReplacements[round][court] = {};

        if (newPlayerId === '' || !newPlayerId) {
            delete playerReplacements[round][court][position];
            if (Object.keys(playerReplacements[round][court]).length === 0) {
                delete playerReplacements[round][court];
            }
            if (Object.keys(playerReplacements[round]).length === 0) {
                delete playerReplacements[round];
            }
        } else {
            newPlayerId = parseInt(newPlayerId);
            // Vérifier si le remplaçant est déjà présent dans ce match
            const allPlayers = Object.values(grid[round][court].players).map(p => positions[p - 1]);
            if (allPlayers.includes(newPlayerId)) {
                showNotice('❌ Ce joueur est déjà sur ce terrain.', 'error');
                return;
            }
            playerReplacements[round][court][position] = newPlayerId;

            // SUBSTITUTION INVERSÉE : le remplaçant prend la place du remplacé
            // et le remplacé prend la place du remplaçant dans tous les autres matchs du même tour
            const replacementLogEntry = {
                round: round + 1,
                court: `Terrain ${court + 1}`,
                position: position,
                oldPlayer: getPlayerName(oldPlayer),
                newPlayer: getPlayerName(newPlayerId),
                timestamp: new Date().toLocaleTimeString()
            };
            replacementLog.unshift(replacementLogEntry);
            if (replacementLog.length > 50) replacementLog = replacementLog.slice(0, 50);
            ST.replacementLog = replacementLog;

            // Inverser les rôles pour les autres matchs du même tour
            const currentRound = grid[round];
            for (let c = 0; c < currentRound.length; c++) {
                if (c === court) continue;
                const courtObj = currentRound[c];
                if (courtObj.rest) continue;
                const pos = courtObj.players;
                const mapped = pos.map(p => {
                    if (p <= positions.length) return positions[p - 1];
                    return null;
                }).filter(p => p !== null);

                // Chercher si le remplaçant ou le remplacé sont dans ce match
                for (let p = 0; p < mapped.length; p++) {
                    if (mapped[p] === newPlayerId) {
                        // Le remplaçant était ici → il prend la place du remplacé
                        if (!playerReplacements[round]) playerReplacements[round] = {};
                        if (!playerReplacements[round][c]) playerReplacements[round][c] = {};
                        playerReplacements[round][c][p] = oldPlayer;
                        replacementLog.unshift({
                            round: round + 1,
                            court: `Terrain ${c + 1}`,
                            position: p,
                            oldPlayer: getPlayerName(newPlayerId),
                            newPlayer: getPlayerName(oldPlayer),
                            timestamp: new Date().toLocaleTimeString()
                        });
                        break;
                    } else if (mapped[p] === oldPlayer) {
                        // Le remplacé était ici → il prend la place du remplaçant
                        if (!playerReplacements[round]) playerReplacements[round] = {};
                        if (!playerReplacements[round][c]) playerReplacements[round][c] = {};
                        playerReplacements[round][c][p] = newPlayerId;
                        replacementLog.unshift({
                            round: round + 1,
                            court: `Terrain ${c + 1}`,
                            position: p,
                            oldPlayer: getPlayerName(oldPlayer),
                            newPlayer: getPlayerName(newPlayerId),
                            timestamp: new Date().toLocaleTimeString()
                        });
                        break;
                    }
                }
            }
        }

        ST.playerReplacements = playerReplacements;
        calculateRanking();
        updateStats();
        renderMatches(); // Re-render pour mettre à jour les select
        showNotice('✅ Remplacement effectué avec inversion des rôles.');
    };

    // ===== CALCULATE RANKING =====
    function calculateRanking() {
        const players = getActivePlayerNumbers();
        const stats = {};
        players.forEach(p => {
            stats[p] = {
                name: getPlayerName(p),
                scored: 0,
                conceded: 0,
                wins: 0,
                draws: 0,
                losses: 0,
                matches: 0
            };
        });

        const grid = ST.schedule || getGridForN();
        if (!grid) return;

        for (let r = 0; r < grid.length; r++) {
            const round = grid[r];
            for (let c = 0; c < round.length; c++) {
                const courtObj = round[c];
                if (courtObj.rest) continue;

                const pos = courtObj.players;
                const mapped = pos.map(p => {
                    if (p <= positions.length) return positions[p - 1];
                    return null;
                }).filter(p => p !== null && players.includes(p));

                const mappedWithRepl = mapped.map((player, position) =>
                    getReplacementPlayer(r, c, position, player)
                );

                let scores;
                if (courtObj.type === '1x1' || courtObj.type === '2x1') {
                    scores = specialMatchScores[r] && specialMatchScores[r][c] ? specialMatchScores[r][c] : { 1: 0, 2: 0 };
                } else {
                    scores = matchScores[r] && matchScores[r][c] ? matchScores[r][c] : { 1: 0, 2: 0 };
                }

                const score1 = parseInt(scores[1]) || 0;
                const score2 = parseInt(scores[2]) || 0;

                if (score1 > 0 || score2 > 0) {
                    if (courtObj.type === '1x1' && mappedWithRepl.length === 2) {
                        process1v1Stats(stats, mappedWithRepl, score1, score2);
                    } else if (courtObj.type === '2x1' && mappedWithRepl.length === 3) {
                        process2v1Stats(stats, mappedWithRepl, score1, score2);
                    } else if (mappedWithRepl.length === 4) {
                        processMatchStats(stats, mappedWithRepl, score1, score2);
                    }
                }
            }
        }

        updateRankingDisplay(stats);
    }

    function processMatchStats(stats, players, score1, score2) {
        stats[players[0]].scored += score1;
        stats[players[0]].conceded += score2;
        stats[players[1]].scored += score1;
        stats[players[1]].conceded += score2;
        stats[players[2]].scored += score2;
        stats[players[2]].conceded += score1;
        stats[players[3]].scored += score2;
        stats[players[3]].conceded += score1;

        players.forEach(p => stats[p].matches++);

        if (score1 > score2) {
            stats[players[0]].wins++;
            stats[players[1]].wins++;
            stats[players[2]].losses++;
            stats[players[3]].losses++;
        } else if (score2 > score1) {
            stats[players[0]].losses++;
            stats[players[1]].losses++;
            stats[players[2]].wins++;
            stats[players[3]].wins++;
        } else {
            stats[players[0]].draws++;
            stats[players[1]].draws++;
            stats[players[2]].draws++;
            stats[players[3]].draws++;
        }
    }

    function process1v1Stats(stats, players, score1, score2) {
        stats[players[0]].scored += score1;
        stats[players[0]].conceded += score2;
        stats[players[1]].scored += score2;
        stats[players[1]].conceded += score1;
        players.forEach(p => stats[p].matches++);
        if (score1 > score2) {
            stats[players[0]].wins++;
            stats[players[1]].losses++;
        } else if (score2 > score1) {
            stats[players[0]].losses++;
            stats[players[1]].wins++;
        } else {
            stats[players[0]].draws++;
            stats[players[1]].draws++;
        }
    }

    function process2v1Stats(stats, players, score1, score2) {
        stats[players[0]].scored += score1;
        stats[players[0]].conceded += score2;
        stats[players[1]].scored += score1;
        stats[players[1]].conceded += score2;
        stats[players[2]].scored += score2;
        stats[players[2]].conceded += score1;
        players.forEach(p => stats[p].matches++);
        if (score1 > score2) {
            stats[players[0]].wins++;
            stats[players[1]].wins++;
            stats[players[2]].losses++;
        } else if (score2 > score1) {
            stats[players[0]].losses++;
            stats[players[1]].losses++;
            stats[players[2]].wins++;
        } else {
            stats[players[0]].draws++;
            stats[players[1]].draws++;
            stats[players[2]].draws++;
        }
    }

    function updateRankingDisplay(stats) {
        const ranking = Object.values(stats).map(s => ({
            ...s,
            diff: s.scored - s.conceded,
            points: (s.wins * 2) + s.draws
        })).sort((a, b) => {
            if (b.points !== a.points) return b.points - a.points;
            if (b.diff !== a.diff) return b.diff - a.diff;
            return b.scored - a.scored;
        });

        const tbody = document.getElementById('rankingBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        ranking.forEach((p, idx) => {
            const tr = document.createElement('tr');
            const pos = idx + 1;
            let medalClass = '';
            let medalIcon = '';
            if (pos === 1) { medalClass = 'gold';
                medalIcon = '🥇'; } else if (pos === 2) { medalClass = 'silver';
                medalIcon = '🥈'; } else if (pos === 3) { medalClass = 'bronze';
                medalIcon = '🥉'; }

            tr.innerHTML = `
                <td><strong>${pos}${medalIcon}</strong></td>
                <td style="text-align:left;">${p.name}</td>
                <td>${p.scored}</td>
                <td>${p.conceded}</td>
                <td>${p.diff > 0 ? '+' + p.diff : p.diff}</td>
                <td>${p.wins}</td>
                <td>${p.draws}</td>
                <td>${p.losses}</td>
            `;
            if (medalClass) {
                tr.querySelector('td:first-child').classList.add(medalClass);
            }
            tbody.appendChild(tr);
        });
    }

                    } else {

    function getPlayerProgramHTML(playerId) {
        const grid = ST.schedule || getGridForN();
        if (!grid || grid.length === 0) return '<p>Aucun match généré.</p>';

        let html = `<table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
            <thead><tr style="background:#9c27b0;color:white;">
                <th style="padding:6px;">Tour</th>
                <th style="padding:6px;">Terrain</th>
                <th style="padding:6px;">Partenaire</th>
                <th style="padding:6px;">Adversaires</th>
                <th style="padding:6px;">Score</th>
                <th style="padding:6px;">Résultat</th>
            </tr></thead><tbody>`;
        let wins = 0, draws = 0, losses = 0, pts = 0;

        for (let r = 0; r < grid.length; r++) {
            const round = grid[r];
            let found = false;
            for (let c = 0; c < round.length; c++) {
                const courtObj = round[c];
                if (courtObj.rest) {
                    if (courtObj.rest === playerId) {
                        html += `<tr><td>${r+1}</td><td colspan="5" style="color:#b87c00;background:#fff3cd;">🟡 Repos</td></tr>`;
                        found = true;
                    }
                    continue;
                }
                const pos = courtObj.players;
                const mapped = pos.map(p => {
                    if (p <= positions.length) return positions[p - 1];
                    return null;
                }).filter(p => p !== null);

                const mappedWithRepl = mapped.map((p, idx) => getReplacementPlayer(r, c, idx, p));

                if (mappedWithRepl.includes(playerId)) {
                    const idx = mappedWithRepl.indexOf(playerId);
                    let partner, opponents, is1v1 = false, is2v1 = false;
                    
                    if (courtObj.type === '1x1' && mappedWithRepl.length === 2) {
                        is1v1 = true;
                        partner = '—';
                        opponents = [mappedWithRepl[1 - idx]];
                    } else if (courtObj.type === '2x1' && mappedWithRepl.length === 3) {
                        is2v1 = true;
                        if (idx < 2) {
                            partner = mappedWithRepl[1 - idx];
                            opponents = [mappedWithRepl[2]];
                        } else {
                            partner = '—';
                            opponents = [mappedWithRepl[0], mappedWithRepl[1]];
                        }
                    } else if (mappedWithRepl.length === 4) {
                        const team = idx < 2 ? 0 : 1;
                        const partnerIdx = team === 0 ? (idx === 0 ? 1 : 0) : (idx === 2 ? 3 : 2);
                        partner = mappedWithRepl[partnerIdx];
                        opponents = team === 0 ? [mappedWithRepl[2], mappedWithRepl[3]] : [mappedWithRepl[0], mappedWithRepl[1]];
                    }

                    let scores;
                    if (courtObj.type === '1x1' || courtObj.type === '2x1') {
                        scores = specialMatchScores[r] && specialMatchScores[r][c] ? specialMatchScores[r][c] : { 1: 0, 2: 0 };
                    } else {
                        scores = matchScores[r] && matchScores[r][c] ? matchScores[r][c] : { 1: 0, 2: 0 };
                    }

                    const isTeam1 = is1v1 ? idx === 0 : (is2v1 ? idx < 2 : idx < 2);
                    const myScore = isTeam1 ? scores[1] : scores[2];
                    const oppScore = isTeam1 ? scores[2] : scores[1];
                    const done = myScore && oppScore && parseInt(myScore) > 0 && parseInt(oppScore) > 0;

                    let result = '—';
                    let resultClass = '';
                    if (done) {
                        const ms = parseInt(myScore);
                        const os = parseInt(oppScore);
                        if (ms > os) { result = 'Victoire'; resultClass = 'victoire'; wins++; pts += 3; }
                        else if (ms < os) { result = 'Défaite'; resultClass = 'defaite'; losses++; }
                        else { result = 'Nul'; resultClass = 'nul'; draws++; pts += 1; }
                    }

                    const partnerName = partner ? getPlayerName(partner) : '—';
                    const opponentsNames = opponents.map(p => getPlayerName(p)).join(' + ');

                    html += `<tr>
                        <td style="padding:6px;text-align:center;">${r+1}</td>
                        <td style="padding:6px;text-align:center;">${c+1}</td>
                        <td style="padding:6px;">${partnerName}</td>
                        <td style="padding:6px;">${opponentsNames}</td>
                        <td style="padding:6px;text-align:center;">${done ? `${myScore} – ${oppScore}` : '—'}</td>
                        <td style="padding:6px;text-align:center;font-weight:bold;color:${result === 'Victoire' ? '#1e8c45' : result === 'Défaite' ? '#c0281a' : '#b87c00'}">${result}</td>
                    </tr>`;
                    found = true;
                    break;
                }
            }
            if (!found) {
                html += `<tr><td>${r+1}</td><td colspan="5" style="color:#999;">—</td></tr>`;
            }
        }

        html += `</tbody></table>`;
        html += `<div style="margin-top:10px;display:flex;gap:20px;flex-wrap:wrap;">
            <div><strong>Points :</strong> ${pts}</div>
            <div style="color:#1e8c45;"><strong>Victoires :</strong> ${wins}</div>
            <div style="color:#b87c00;"><strong>Nuls :</strong> ${draws}</div>
            <div style="color:#c0281a;"><strong>Défaites :</strong> ${losses}</div>
        </div>`;

        return html;
    }

    // ===== RESET =====
    window.resetAll = function() {
        if (!confirm('Confirmer la réinitialisation complète ?')) return;
        positions = Array.from({ length: N }, (_, i) => i + 1);
        ST.positions = positions;
        matchScores = {};
        specialMatchScores = {};
        playerReplacements = {};
        replacementLog = [];
        ST.matchScores = {};
        ST.specialMatchScores = {};
        ST.playerReplacements = {};
        ST.replacementLog = [];
        ST.schedule = [];
        for (let i = 1; i <= 20; i++) {
            const el = document.getElementById('player' + i);
            if (el) el.value = 'Joueur ' + i;
            ST.players[i] = 'Joueur ' + i;
        }
        buildPlayerInputs();
        updatePositions();
        updatePlayerProgramSelect();
        document.getElementById('matchesDisplay').innerHTML = '<p style="text-align:center;color:#666;padding:20px;">Cliquez sur "Générer" pour créer les matchs</p>';
        document.getElementById('rankingBody').innerHTML = '';
        document.getElementById('statsArea').innerHTML = '<p style="text-align:center;color:#666;padding:20px;">Les statistiques apparaîtront après génération du tournoi</p>';
        updateStatusBar();
        showNotice('Réinitialisation effectuée');
    };

    // ===== SAVE =====
    window.saveData = function() {
        showNotice('✅ Données sauvegardées (simulé)');
    };

    // ===== SHOW TAB =====
    window.showTab = function(tabName) {
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const tab = document.getElementById(tabName);
        if (tab) tab.classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(tabName)) {
                btn.classList.add('active');
            }
        });
        if (tabName === 'matchesTab' && (!ST.schedule || ST.schedule.length === 0)) {
            document.getElementById('matchesDisplay').innerHTML = '<p style="text-align:center;color:#666;padding:20px;">Cliquez sur "Générer" pour créer les matchs</p>';
        }
        if (tabName === 'playersTab') {
            updatePlayerProgramSelect();
        }
    };

    // ===== PUBLIC ACCESS =====
    function togglePublicAccess() {
        publicAccess = document.getElementById('publicAccessToggle').checked;
        document.getElementById('publicAccessLabel').textContent = publicAccess ? 'Activé' : 'Désactivé';
        updatePublicButtons();
        updateSpectatorMode();
        if (publicAccess) {
            showNotice('🔓 Accès public activé');
        } else {
            showNotice('🔒 Accès public désactivé');
        }
    }

    function updatePublicButtons() {
        const buttons = ['btnLive', 'btnScreen', 'btnPlayers', 'btnProgram'];
        buttons.forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            if (publicAccess) {
                btn.className = 'btn unlocked';
                btn.disabled = false;
            } else {
                btn.className = 'btn locked';
                btn.disabled = true;
            }
        });
        // Afficher/masquer le programme individuel
        const programCard = document.getElementById('programCard');
        if (programCard) {
            programCard.style.display = publicAccess ? 'block' : 'none';
        }
    }

    function updateSpectatorMode() {
        if (!publicAccess && !isAdmin) {
            document.body.classList.add('spectator-mode');
        } else {
            document.body.classList.remove('spectator-mode');
        }
        // Masquer les éléments admin si non admin
        if (!isAdmin) {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.spectator-only').forEach(el => el.style.display = '');
        } else {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
            document.querySelectorAll('.spectator-only').forEach(el => el.style.display = 'none');
        }
    }

    // ===== NAVIGATION PUBLIQUE =====
    window.goToLive = function() {
        if (!publicAccess && !isAdmin) {
            showNotice('❌ Accès public désactivé.', 'error');
            return;
        }
        showTab('matchesTab');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.tab-btn[onclick*="matchesTab"]')?.classList.add('active');
    };

    window.goToTV = function() {
        if (!publicAccess && !isAdmin) {
            showNotice('❌ Accès public désactivé.', 'error');
            return;
        }
        showNotice('📺 Mode Écran - Affichage plein écran');
        // Simulation d'écran
        document.body.style.background = '#0a0a0a';
        document.body.style.color = '#fff';
        document.querySelector('.app').style.background = 'rgba(0,0,0,0.9)';
        document.querySelector('.app').style.boxShadow = 'none';
        document.querySelector('header').innerHTML = `
            <h1 style="color:#7affa0;">🏓 Pickleball - Écran</h1>
            <div style="color:#aaa;font-size:0.9rem;">${new Date().toLocaleTimeString()}</div>
            <button class="btn" onclick="exitTV()" style="background:#333;color:#fff;">Retour</button>
        `;
        document.querySelectorAll('.tabs, .status-bar, .controls').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.tab').forEach(t => t.classList.add('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.style.display = 'none');
        document.getElementById('playersTab').style.display = 'none';
        document.getElementById('rankingTab').style.display = 'none';
        document.getElementById('statsTab').style.display = 'none';
        document.getElementById('matchesTab').style.display = 'block';
    };

    window.exitTV = function() {
        document.body.style.background = '#f0fff0';
        document.body.style.color = '#333';
        document.querySelector('.app').style.background = 'rgba(255,255,255,0.98)';
        document.querySelector('.app').style.boxShadow = '0 8px 32px rgba(0,0,0,0.1)';
        location.reload();
    };

    window.showPlayersTab = function() {
        if (!publicAccess && !isAdmin) {
            showNotice('❌ Accès public désactivé.', 'error');
            return;
        }
        showTab('playersTab');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.tab-btn[onclick*="playersTab"]')?.classList.add('active');
        // Afficher le programme individuel
        const programCard = document.getElementById('programCard');
        if (programCard) programCard.style.display = 'block';
    };

    window.showProgram = function() {
        if (!publicAccess && !isAdmin) {
            showNotice('❌ Accès public désactivé.', 'error');
            return;
        }
        showTab('playersTab');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.tab-btn[onclick*="playersTab"]')?.classList.add('active');
        const programCard = document.getElementById('programCard');
        if (programCard) programCard.style.display = 'block';
        const display = document.getElementById('playerProgramDisplay');
        if (display) {
            display.style.display = 'block';
            const select = document.getElementById('playerProgramSelect');
            if (select && select.value) {
                showPlayerProgram();
            } else {
                display.innerHTML = '<p style="color:#666;">Sélectionnez un joueur pour voir son programme.</p>';
            }
        }
    };

    // ===== LOGOUT =====
    window.logout = function() {
        isAdmin = false;
        publicAccess = false;
        document.getElementById('publicAccessToggle').checked = false;
        document.getElementById('publicAccessLabel').textContent = 'Désactivé';
        document.body.classList.add('spectator-mode');
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.spectator-only').forEach(el => el.style.display = '');
        updatePublicButtons();
        showNotice('👋 Déconnexion - Mode spectateur');
    };

    // ===== NOTICE =====
    function showNotice(message, type) {
        const notice = document.getElementById('notice');
        if (notice) {
            notice.textContent = message;
            notice.className = type === 'error' ? 'error' : '';
            notice.style.display = 'block';
            setTimeout(() => notice.style.display = 'none', 3000);
        }
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', init);
    window.changeCourtsCount = changeCourtsCount;
    window.changePlayerCount = changePlayerCount;
    window.togglePublicAccess = togglePublicAccess;
</script>
</body>
</html>
